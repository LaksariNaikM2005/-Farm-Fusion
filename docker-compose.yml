version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - CLIENT_URL=http://localhost:5173
    env_file:
      - ./backend/.env
    networks:
      - farmfusion-net
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - farmfusion-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    ports:
      - "5173:80"
    networks:
      - farmfusion-net
    depends_on:
      - backend

networks:
  farmfusion-net:
    driver: bridge

volumes:
  mongo-data: